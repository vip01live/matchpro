name: MatchPro integrity check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate sitemap generator syntax
        run: python -m py_compile tools/upgrade_matchpro.py

      - name: Validate site structure and local resources
        run: node tools/validate-site.mjs

      - name: Validate admin CMS and media handling
        run: node tools/validate-admin.mjs

      - name: Validate server-side backend syntax
        run: node --check backend/cloudflare-worker.mjs && node --check backend/hash-admin-password.mjs

      - name: Test server-side authentication and GitHub proxy
        run: node --test backend/cloudflare-worker.test.mjs

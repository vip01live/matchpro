name: MatchPro CMS validation

on:
  push:
    branches:
      - "cms/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: |
          node --check main/js/admin-cms.js
          node --check main/js/cms-runtime.js
          node --check main/js/matchpro.js
          node --check main/js/player-config.js

      - name: Validate Python and JSON syntax
        run: |
          python -m py_compile tools/apply-cms-metadata.py tools/validate-site-performance.py
          python -m json.tool main/js/site-settings.json > /dev/null

      - name: Validate existing site and admin structure
        run: |
          node tools/validate-site.mjs
          node tools/validate-admin.mjs

      - name: Generate metadata in a temporary build copy
        run: |
          python tools/apply-cms-metadata.py
          python tools/validate-site-performance.py
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              'name="twitter:card"',
              'name="twitter:title"',
              'name="twitter:description"',
              'name="twitter:image"',
              'property="og:title"',
              'property="og:description"',
              'rel="canonical"',
              'cms-runtime.js'
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit("Homepage missing generated metadata: " + ", ".join(missing))
          for name in ("twitter:card", "twitter:title", "twitter:description", "twitter:image"):
              count = len(re.findall(r"<meta\b[^>]*\bname=[\'\"]" + re.escape(name) + r"[\'\"]", html, re.I))
              if count != 1:
                  raise SystemExit(f"Expected exactly one {name} tag, found {count}")
          print("CMS metadata smoke test passed.")
          PY
